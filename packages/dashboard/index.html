<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Harness MVP · Dashboard</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #0b0f14;
        color: #d4e0ea;
        margin: 0;
        padding: 16px;
      }
      h1 { font-size: 13px; color: #6a8099; font-weight: 500; letter-spacing: .1em; margin: 0 0 12px; }
      .grid { display: grid; grid-template-columns: 1fr 280px; gap: 16px; }
      .events {
        background: #131a22; border-radius: 8px; padding: 10px;
        height: calc(100vh - 80px); overflow-y: auto;
      }
      .ev { padding: 5px 8px; border-left: 3px solid #2a3746; margin-bottom: 3px; font-size: 12px; }
      .ev.github  { border-color: #58a6ff; }
      .ev.harness { border-color: #d29922; }
      .ev.worker  { border-color: #3fb950; }
      .ev.openapi { border-color: #a371f7; }
      .ts { color: #6a8099; }
      .src { font-weight: 600; }
      .ev.github  .src { color: #58a6ff; }
      .ev.harness .src { color: #d29922; }
      .ev.worker  .src { color: #3fb950; }
      .details { color: #8b949e; font-size: 11px; white-space: pre-wrap; word-break: break-all; margin-top: 2px; }
      aside { background: #131a22; border-radius: 8px; padding: 12px; height: fit-content; }
      .stat { display: flex; justify-content: space-between; padding: 5px 0; font-size: 12px; border-bottom: 1px solid #1c242e; }
      .stat:last-child { border-bottom: none; }
      .stat b { color: #d4e0ea; }
    </style>
  </head>
  <body>
    <h1>HARNESS MVP · 事件流</h1>
    <div class="grid">
      <div class="events" id="events"></div>
      <aside>
        <div class="stat"><span>连接</span><b id="status">连接中…</b></div>
        <div class="stat"><span>事件数</span><b id="count">0</b></div>
        <div class="stat"><span>最后序号</span><b id="seq">0</b></div>
      </aside>
    </div>
    <script>
      const eventsEl = document.getElementById('events');
      let count = 0, lastSeq = 0;
      const es = new EventSource('/api/events/stream');
      es.onopen = () => (document.getElementById('status').textContent = '已连接');
      es.onerror = () => (document.getElementById('status').textContent = '重连中…');
      es.onmessage = (e) => {
        const ev = JSON.parse(e.data);
        if (ev.seq <= lastSeq) return;
        lastSeq = ev.seq;
        count++;
        document.getElementById('count').textContent = count;
        document.getElementById('seq').textContent = lastSeq;
        const div = document.createElement('div');
        div.className = 'ev ' + ev.source;
        const details =
          ev.details && Object.keys(ev.details).length
            ? `<div class="details">${JSON.stringify(ev.details).slice(0, 400)}</div>`
            : '';
        div.innerHTML =
          `<span class="ts">${new Date(ev.timestamp).toLocaleTimeString()}</span> ` +
          `<span class="src">[${ev.source}]</span> ${ev.event}` +
          (ev.runId ? ` <span class="ts">run=${ev.runId}</span>` : '') +
          details;
        eventsEl.appendChild(div);
        eventsEl.scrollTop = eventsEl.scrollHeight;
      };
    </script>
  </body>
</html>
